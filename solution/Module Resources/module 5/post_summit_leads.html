        th { background-color: #334155; color: #cbd5e1; padding: 1rem; text-align: left; font-weight: 600; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.05em; border-bottom: 2px solid #475569; }

            <p class="text-slate-400 mt-2 text-sm">Real-time attendee engagement and lead scoring analysis</p>
        </header>

        <!-- KPIs -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="card flex flex-col justify-center items-center text-center">
                <h3 class="text-slate-400 text-sm font-semibold uppercase tracking-wider mb-2">Total Registrants</h3>
                <p class="text-5xl font-bold text-white" id="kpi-registrants">0</p>
            </div>
            <div class="card flex flex-col justify-center items-center text-center">
                <h3 class="text-slate-400 text-sm font-semibold uppercase tracking-wider mb-2">Show Rate</h3>
                <p class="text-5xl font-bold text-blue-400" id="kpi-show-rate">0%</p>
            </div>
            <div class="card flex flex-col justify-center items-center text-center border-t-4 border-t-red-500">
                <h3 class="text-slate-400 text-sm font-semibold uppercase tracking-wider mb-2">Hot Leads (Score ≥ 85)</h3>
                <p class="text-5xl font-bold text-red-500" id="kpi-hot-leads">0</p>
            </div>
        </div>

        <!-- Charts -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="card">
                <h3 class="text-lg font-semibold mb-4 text-white">Lead Segment Breakdown</h3>
                <div class="relative h-72">
                    <canvas id="segmentsChart"></canvas>
                </div>
            </div>
            <div class="card">
                <h3 class="text-lg font-semibold mb-4 text-white">Engagement Funnel</h3>
                <div class="relative h-72">
                    <canvas id="funnelChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Table -->
        <div class="card overflow-hidden !p-0 mt-8">
            <div class="p-6 border-b border-slate-700 bg-slate-800/50">
                <h3 class="text-xl font-semibold text-white flex items-center gap-2">
                    <span class="text-red-500">🔥</span> Hot Leads Directory
                </h3>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Practice</th>
                            <th>State</th>
                            <th>Size</th>
                            <th>Telehealth Status</th>
                            <th>Score</th>
                        </tr>
                    </thead>
                    <tbody id="hot-leads-tbody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>
