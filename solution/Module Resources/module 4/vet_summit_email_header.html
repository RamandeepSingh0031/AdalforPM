<!DOCTYPE html>

    <style>
        /* Reset & Dark Mode Overrides */

        body {

            background-color: #050505 !important; 
        }
        table { 
            border-spacing: 0; 
            border-collapse: collapse; 
            mso-table-lspace: 0pt; 
            mso-table-rspace: 0pt; 
        }
        img { 
            border: 0; 
            line-height: 100%; 
            outline: none; 
            text-decoration: none; 
            -ms-interpolation-mode: bicubic; 
        }
        
        /* Force Dark Mode backgrounds to stay dark in Apple/Outlook */
        @media (prefers-color-scheme: dark) {
            .dark-bg { background-color: #050505 !important; }
            .dark-text { color: #ffffff !important; }
            .gold-text { color: #9A8E4E !important; }
        }
        
        /* Hidden Preheader */
        .preheader { 
            display: none !important; 
            visibility: hidden; 
            mso-hide: all; 
            font-size: 1px; 
            line-height: 1px; 
            max-height: 0; 
            max-width: 0; 
            opacity: 0; 
            overflow: hidden; 
        }
    </style>
